name: Daily news digest

on:
  schedule:
    # Target: 8:00am in Atlantic/Bermuda. GitHub Actions cron is UTC and does
    # NOT track DST, so both offsets are scheduled and the `gate` job below
    # cancels whichever one isn't 8am locally today.
    #   11:00 UTC = 8:00am ADT (summer, UTC-3)
    #   12:00 UTC = 8:00am AST (winter, UTC-4)
    - cron: "0 11 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

# never let two digest runs race each other's git push
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  # Exactly one of the two crons is 8am in Bermuda on any given day.
  # Manual runs (workflow_dispatch) always proceed.
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour=$(TZ=Atlantic/Bermuda date +%H)
          if [ "$hour" = "08" ]; then
            echo "Local hour is 08 — running."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Local hour is $hour, not 08 — skipping (other cron covers today)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  digest:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline/main.py

      - name: Commit and push digest
        run: |
          git config user.name "digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/digest
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Digest for $(date -u +%F)"
          # re-runs and concurrent pushes: replay our digest commit on top of
          # whatever main has become since this run's snapshot
          git pull --rebase origin main
          git push
